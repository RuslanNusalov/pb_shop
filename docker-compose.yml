version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pb_shop_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Опционально: платежные данные
      PAYMENT_CARD_NUMBER: ${PAYMENT_CARD_NUMBER:-}
      PAYMENT_CARD_HOLDER: ${PAYMENT_CARD_HOLDER:-}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pb_shop_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn pb_shop.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_data:/app/static:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    networks:
      - pb_shop_network
    command: [nginx-debug, '-g', 'daemon off;']

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  pb_shop_network:
    driver: bridge