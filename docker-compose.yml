services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pb_shop}
      POSTGRES_USER: ${POSTGRES_USER:-pb_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pb_shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pb_shop} -d ${POSTGRES_DB:-pb_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-pb_shop}
      POSTGRES_USER: ${POSTGRES_USER:-pb_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pb_shop}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PAYMENT_CARD_NUMBER: ${PAYMENT_CARD_NUMBER:-}
      PAYMENT_CARD_HOLDER: ${PAYMENT_CARD_HOLDER:-}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
