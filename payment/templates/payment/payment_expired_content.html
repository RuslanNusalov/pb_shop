<main class="mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="text-center py-20 max-w-xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-4 uppercase">Срок оплаты истёк</h1>
        <p class="text-gray-600 mb-4">Заказ #{{ order.id }} не был оплачен вовремя.</p>
        {% if order.payment_reference %}
        <p class="text-gray-600 mb-8">Код платежа: <strong>{{ order.payment_reference }}</strong></p>
        {% endif %}
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'main:index' %}"
               hx-get="{% url 'main:index' %}"
               hx-target="#main-content"
               hx-push-url="true"
               class="bg-black text-white px-6 py-3 text-sm font-medium uppercase hover:bg-gray-800 transition-colors">
                Продолжить покупки
            </a>
            <a href="{% url 'users:order_history' %}"
               hx-get="{% url 'users:order_history' %}"
               hx-target="#main-content"
               hx-push-url="true"
               class="border border-gray-300 px-6 py-3 text-sm font-medium uppercase hover:bg-gray-50 transition-colors">
                История заказов
            </a>
        </div>
    </div>
</main>
