{% extends 'main/base.html' %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<main class="min-h-[60vh] flex items-center justify-center py-20">
    <div class="text-center max-w-md mx-auto px-4">
        <h1 class="text-8xl font-bold text-gray-900 mb-4">404</h1>
        <p class="text-xl text-gray-600 mb-8">
            {% if exception %}
                {{ exception }}
            {% else %}
                Страница не найдена
            {% endif %}
        </p>
        <div class="flex gap-4 justify-center">
            <a href="{% url 'main:index' %}" 
               hx-get="{% url 'main:index' %}" 
               hx-target="#main-content" 
               hx-push-url="true"
               class="inline-block px-6 py-3 bg-black text-white rounded-lg hover:bg-gray-800 transition-colors">
                На главную
            </a>
            <a href="{% url 'main:catalog_all' %}" 
               hx-get="{% url 'main:catalog_all' %}" 
               hx-target="#main-content" 
               hx-push-url="true"
               class="inline-block px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                В каталог
            </a>
        </div>
    </div>
</main>
{% endblock %}
