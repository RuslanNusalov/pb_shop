<div id="ozon-delivery-cost-card"
     class="border-2 border-black rounded-sm bg-blue-50 p-4"
     data-delivery-cost="{{ cost }}">

  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs text-gray-600 uppercase tracking-wide">Стоимость доставки</p>
      <p class="text-2xl font-black text-black mt-1">{{ cost }} ₽</p>
    </div>
    <div class="text-right text-xs text-gray-700 leading-5">
      <p>Срок: <b class="text-black">{{ delivery_time }}</b></p>
      <p>ПВЗ №{{ map_point_id }}</p>
    </div>
  </div>

  <p class="text-xs text-gray-600 mt-3">Доставка будет добавлена к сумме заказа.</p>

  <!-- скрытые поля для оформления заказа -->
  <input type="hidden" name="ozon_point_id" value="{{ map_point_id }}">
  <input type="hidden" name="apiship_tariff_id" value="{{ tariff_id }}">
  <input type="hidden" name="apiship_provider_key" value="{{ provider_key|default:'ozonlog' }}">
  <input type="hidden" name="delivery_cost" value="{{ cost }}">
  <input type="hidden" name="delivery_time" value="{{ delivery_time }}">
</div>

<script>
(function () {
  var pid = '{{ map_point_id }}';
  var cost = parseFloat(document.getElementById('ozon-delivery-cost-card').dataset.deliveryCost) || 0;

  // 1. Возвращаем выделение выбранного пункта (если список перерисовался)
  var radio = document.querySelector('input[name="ozon_point_radio"][value="' + pid + '"]');
  if (radio) {
    radio.checked = true;
    document.querySelectorAll('.pvz-item').forEach(function (el) {
      el.classList.remove('border-black', 'bg-blue-50');
      el.classList.add('border-gray-200');
    });
    var label = radio.closest('.pvz-item');
    if (label) { label.classList.remove('border-gray-200'); label.classList.add('border-black', 'bg-blue-50'); }
  }

  // 2. Плюсуем доставку к итогу заказа
  var sub = document.querySelector('[data-checkout-subtotal]');
  var tot = document.querySelector('[data-checkout-total]');
  var del = document.querySelector('[data-checkout-delivery]');
  if (del) del.textContent = cost.toLocaleString('ru-RU') + ' ₽';
  if (sub && tot) {
    var subVal = parseFloat(sub.dataset.value || sub.textContent.replace(/[^\d.,]/g, '').replace(',', '.')) || 0;
    tot.textContent = (subVal + cost).toLocaleString('ru-RU') + ' ₽';
  }
})();
</script>
