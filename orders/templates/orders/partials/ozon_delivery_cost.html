{% comment %}
  Контекст: cost, delivery_time, map_point_id, tariff_id, provider_key
{% endcomment %}

<div class="border-2 border-black rounded-sm bg-blue-50 p-4 mt-4">
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="text-xs text-gray-600 uppercase tracking-wide font-semibold">Стоимость доставки</p>
            <p class="text-2xl font-black text-black mt-1">{{ cost }} ₽</p>
        </div>
        <div class="text-right text-xs text-gray-700 leading-5">
            <p>Срок: <b class="text-black">{{ delivery_time }}</b></p>
            <p>ПВЗ №{{ map_point_id }}</p>
        </div>
    </div>
    <p class="text-xs text-gray-600 mt-3">✅ Стоимость автоматически добавлена к итоговой сумме заказа справа.</p>
</div>

<script>
    // Сообщаем главному шаблону, что доставка рассчитана, передаём данные для пересчёта
    (function() {
        if (typeof window.updateOzonDelivery === 'function') {
            window.updateOzonDelivery(
                '{{ cost }}',
                '{{ map_point_id }}',
                'ПВЗ №{{ map_point_id }}'
            );
        }
    })();
</script>
