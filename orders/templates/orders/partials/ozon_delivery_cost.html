{% if error_msg %}
    <div class="p-3 bg-red-50 border border-red-200 rounded-sm text-red-700 text-xs">
        Не удалось рассчитать доставку: {{ error_msg }}
    </div>
{% elif cost %}
    <div class="p-4 bg-green-50 border border-green-200 rounded-sm">
        <div class="flex justify-between items-center mb-2">
            <span class="text-sm text-gray-600">Стоимость доставки:</span>
            <span class="text-lg font-bold text-black">₽{{ cost }}</span>
        </div>
        {% if delivery_time %}
        <div class="flex justify-between items-center">
            <span class="text-sm text-gray-600">Срок доставки:</span>
            <span class="text-sm font-medium text-black">{{ delivery_time }}</span>
        </div>
        {% endif %}
    </div>
    <script>
        window.updateOzonDelivery(
            "{{ cost }}",
            "{{ map_point_id }}",
            ""
        );
    </script>
{% else %}
    <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-sm text-yellow-700 text-xs">
        Доставка недоступна для этого пункта.
    </div>
{% endif %}
