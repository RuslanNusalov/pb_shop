{% load ozon_tags %}

{% if not pvz_list %}
    <p class="text-gray-500 text-sm text-center py-4">ПВЗ не найдены. Попробуйте изменить адрес.</p>
{% else %}
    <div class="space-y-2 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
        <p class="text-xs text-gray-600 mb-2">Найдено {{ pvz_list|length }} пунктов выдачи. Выберите удобный:</p>
        {% for pvz in pvz_list %}
            <label class="flex items-start p-3 border-2 border-gray-200 rounded-sm cursor-pointer hover:border-black transition has-[:checked]:border-black has-[:checked]:bg-blue-50">
                <input type="radio" 
                       name="ozon_point_radio" 
                       value="{{ pvz.map_point_id }}" 
                       class="mt-1 mr-3 h-4 w-4 text-black border-black"
                       hx-get="{% url 'orders:ozon_delivery_checkout' %}"
                       hx-target="#ozon-delivery-cost-block"
                       hx-swap="innerHTML"
                       hx-vals='js:{
                           "map_point_id": "{{ pvz.map_point_id }}",
                           "phone": document.querySelector("input[name=phone]")?.value.replace(/\D/g, "") || ""
                       }'>
                <div class="text-sm flex-1">
                    <div class="font-medium text-black">{{ pvz.name|default:"Пункт выдачи Ozon" }}</div>
                    <div class="text-gray-600 text-xs mt-1">📍 {{ pvz.address }}</div>
                    <div class="text-gray-500 text-xs mt-1">🕐 {{ pvz.working_hours|format_working_hours }}</div>
                </div>
            </label>
        {% endfor %}
    </div>
{% endif %}
