[project]
name = "pb-shop"
version = "0.1.0"
description = "Магазин одежды \"Правый берег\""
authors = [
    {name = "Ruslan Nusalov"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "whitenoise (>=6.12.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
