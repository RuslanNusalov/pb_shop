<div class="space-y-3" id="promo-section">
    {% if message %}
    <div class="text-sm {% if status == 'error' %}text-red-600{% elif status == 'success' %}text-green-600{% else %}text-gray-500{% endif %}">
        {{ message }}
    </div>
    {% endif %}

    {% if cart.promo_code %}
    <div class="flex items-center justify-between bg-green-50 border border-green-200 p-3 rounded-lg">
        <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-green-800">✅ {{ cart.promo_code.code }}</span>
            <span class="text-xs text-green-600">-{{ cart.promo_discount }} ₽</span>
        </div>
        <form hx-post="{% url 'cart:remove_promo' %}" hx-target="#promo-section" hx-swap="innerHTML">
            {% csrf_token %}
            <button type="submit" class="text-xs text-red-600 hover:text-red-800 font-medium">Удалить</button>
        </form>
    </div>
    {% else %}
    <form hx-post="{% url 'cart:apply_promo' %}" hx-target="#promo-section" hx-swap="innerHTML" class="flex gap-2">
        {% csrf_token %}
        <input type="text" name="code" placeholder="ПРОМОКОД" 
               class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm font-medium uppercase focus:outline-none focus:border-black">
        <button type="submit" class="bg-black text-white px-4 py-2 text-sm font-medium rounded-lg hover:bg-gray-800 transition-colors">
            ОК
        </button>
    </form>
    {% endif %}
</div>
